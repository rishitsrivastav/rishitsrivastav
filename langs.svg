    </rect><rect x="329.6" y="46" width="0" height="14" fill="#4fa8ff">
      <animate attributeName="width" from="0" to="68.8" dur="0.9s" begin="0.85s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.3 1" keyTimes="0;1"/>
