<svg width="470" height="260" viewBox="0 0 470 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#170e28"/>
      <stop offset="100%" stop-color="#1c1230"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7eb6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <clipPath id="round"><rect x="0" y="0" width="470" height="260" rx="16"/></clipPath>
    <style><![CDATA[
      text { font-family:'Segoe UI',Arial,sans-serif; }
      .mono { font-family:'Courier New',monospace; }
      .slide { opacity:0; transform:translateX(-14px); animation:slideIn 0.6s ease-out forwards; }
      @keyframes slideIn { to { opacity:1; transform:translateX(0); } }
      .pop { opacity:0; transform:scale(0.6); transform-box:fill-box; transform-origin:center; animation:popIn 0.5s cubic-bezier(.2,1.5,.4,1) forwards; }
      @keyframes popIn { to { opacity:1; transform:scale(1); } }
      .blink { animation:blink 1.4s steps(1) infinite; }
      @keyframes blink { 50% { opacity:0.25; } }
    ]]></style>
  </defs>
  <g clip-path="url(#round)">
    <rect x="0" y="0" width="470" height="260" fill="url(#bg)"/>
    <text x="20" y="30" font-size="15" font-weight="700" fill="#e6edf3">Most Used Languages</text>
  </g>
  <rect x="0.6" y="0.6" width="468.8" height="258.8" rx="16" fill="none" stroke="#c084fc" stroke-width="1.2" opacity="0.7"/>
  <rect x="20" y="46" width="430" height="14" rx="7" fill="#2a1f3d"/>
