<svg width="470" height="200" viewBox="0 0 470 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#170e28"/>
      <stop offset="100%" stop-color="#1c1230"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7eb6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <clipPath id="round"><rect x="0" y="0" width="470" height="200" rx="16"/></clipPath>
    <style><![CDATA[
      text { font-family:'Segoe UI',Arial,sans-serif; }
      .mono { font-family:'Courier New',monospace; }
      .slide { opacity:0; transform:translateX(-14px); animation:slideIn 0.6s ease-out forwards; }
      @keyframes slideIn { to { opacity:1; transform:translateX(0); } }
      .blink { animation:blink 1.4s steps(1) infinite; }
      @keyframes blink { 50% { opacity:0.25; } }
    ]]></style>
  </defs>
  <g clip-path="url(#round)">
    <rect x="0" y="0" width="470" height="200" fill="url(#bg)"/>
    <text x="20" y="30" font-size="15" font-weight="700" fill="#e6edf3">Rishit's Dev Snapshot</text>
  </g>
  <rect x="0.6" y="0.6" width="468.8" height="198.8" rx="16" fill="none" stroke="#c084fc" stroke-width="1.2" opacity="0.7"/>

    <g class="slide" style="animation-delay:0.30s">
      <text x="20" y="62" font-size="12" font-weight="600" fill="#cdd3dd">CGPA (current)</text>
      <text x="450" y="62" text-anchor="end" class="mono" font-size="12" fill="#e6edf3">9.72 / 10</text>
      <rect x="20" y="68" width="430" height="7" rx="3.5" fill="#2a1f3d"/>
      <rect x="20" y="68" width="0" height="7" rx="3.5" fill="#ff7eb6">
        <animate attributeName="width" from="0" to="417.1" dur="1s" begin="0.45s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.3 1" keyTimes="0;1"/>
      </rect>
    </g>
    <g class="slide" style="animation-delay:0.48s">
      <text x="20" y="98" font-size="12" font-weight="600" fill="#cdd3dd">Hackathons Won</text>
      <text x="450" y="98" text-anchor="end" class="mono" font-size="12" fill="#e6edf3">2</text>
      <rect x="20" y="104" width="430" height="7" rx="3.5" fill="#2a1f3d"/>
      <rect x="20" y="104" width="0" height="7" rx="3.5" fill="#8b5cf6">
        <animate attributeName="width" from="0" to="430.0" dur="1s" begin="0.63s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.3 1" keyTimes="0;1"/>
      </rect>
    </g>
    <g class="slide" style="animation-delay:0.66s">
      <text x="20" y="134" font-size="12" font-weight="600" fill="#cdd3dd">Certifications Earned</text>
      <text x="450" y="134" text-anchor="end" class="mono" font-size="12" fill="#e6edf3">4</text>
      <rect x="20" y="140" width="430" height="7" rx="3.5" fill="#2a1f3d"/>
      <rect x="20" y="140" width="0" height="7" rx="3.5" fill="#ff7eb6">
        <animate attributeName="width" from="0" to="344.0" dur="1s" begin="0.81s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.3 1" keyTimes="0;1"/>
      </rect>
    </g>
    <g class="slide" style="animation-delay:0.84s">
      <text x="20" y="170" font-size="12" font-weight="600" fill="#cdd3dd">Leadership Roles</text>
      <text x="450" y="170" text-anchor="end" class="mono" font-size="12" fill="#e6edf3">2</text>
      <rect x="20" y="176" width="430" height="7" rx="3.5" fill="#2a1f3d"/>
      <rect x="20" y="176" width="0" height="7" rx="3.5" fill="#8b5cf6">
        <animate attributeName="width" from="0" to="301.0" dur="1s" begin="0.99s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.3 1" keyTimes="0;1"/>
      </rect>
    </g>
</svg>
